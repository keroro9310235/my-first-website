<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上緯投控 (3708) 淨值計算機</title>
    <!-- 引入 Tailwind CSS (樣式庫) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 和 ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- 引入 Babel (讓瀏覽器看懂 React 程式碼) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 圖示組件 (手動定義 SVG 以確保無需安裝即可運作) ---
        const Calculator = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>
        );
        const TrendingUp = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        );
        const DollarSign = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        );
        const RefreshCcw = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
        );
        const Info = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        );

        function App() {
            // --- 1. 設定狀態 (State) ---
            const [marketData, setMarketData] = useState({
                smPrice: 25.80,      // 上緯新材股價 (RMB)
                exchangeRate: 4.45,  // 匯率 (RMB -> TWD)
                shPrice: 106.5       // 上緯投控股價 (TWD)
            });

            const [constants, setConstants] = useState({
                smShares: 80672346,  // 上緯新材持有股數 (固定)
                shOutstanding: 107751900, // 上緯投控流通股數 (預估)
                baseNav: 140.0       // 使用者預測的 Q4 基礎淨值
            });

            const REVALUATION_GAIN = 3752000000;

            const [results, setResults] = useState({
                totalValueTwd: 0,
                netValueTwd: 0,
                navContribution: 0,
                totalEstimatedNav: 0,
                pbRatio: 0
            });

            // --- 2. 計算邏輯 ---
            useEffect(() => {
                const totalValue = marketData.smPrice * constants.smShares * marketData.exchangeRate;
                const netValue = totalValue - REVALUATION_GAIN;
                const contribution = netValue / constants.shOutstanding;
                const totalNav = contribution + constants.baseNav;
                const pb = totalNav !== 0 ? marketData.shPrice / totalNav : 0;

                setResults({
                    totalValueTwd: totalValue,
                    netValueTwd: netValue,
                    navContribution: contribution,
                    totalEstimatedNav: totalNav,
                    pbRatio: pb
                });
            }, [marketData, constants]);

            // --- 3. 處理輸入變更 ---
            const handleMarketChange = (e) => {
                const { name, value } = e.target;
                setMarketData(prev => ({
                    ...prev,
                    [name]: parseFloat(value) || 0
                }));
            };

            const handleConstantChange = (e) => {
                const { name, value } = e.target;
                setConstants(prev => ({
                    ...prev,
                    [name]: parseFloat(value) || 0
                }));
            };

            const formatNumber = (num) => {
                return new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 0 }).format(num);
            };

            return (
                <div className="min-h-screen bg-slate-50 p-4 md:p-8 font-sans text-slate-800">
                <div className="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
                    
                    {/* 標題區 */}
                    <div className="bg-slate-900 p-6 text-white flex items-center justify-between">
                    <div>
                        <h1 className="text-2xl md:text-3xl font-bold flex items-center gap-3">
                        <Calculator className="w-8 h-8 text-teal-400" />
                        上緯投控 (3708) 淨值計算機
                        </h1>
                        <p className="text-slate-400 mt-2 text-sm">
                        邏輯修正：扣除已認列重估利益 37.52 億後計算貢獻值
                        </p>
                    </div>
                    <div className="text-right hidden md:block">
                        <span className="bg-teal-600 text-xs px-2 py-1 rounded text-white">Live Calculation</span>
                    </div>
                    </div>

                    <div className="p-6 grid gap-8">
                    
                    {/* 區塊 1: 市場即時輸入 */}
                    <div className="bg-orange-50 border border-orange-100 rounded-xl p-5">
                        <h2 className="text-orange-800 font-bold mb-4 flex items-center gap-2">
                        <RefreshCcw className="w-5 h-5" /> 
                        第一步：輸入目前市場報價
                        </h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        
                        {/* 輸入: 上緯新材股價 */}
                        <div className="flex flex-col">
                            <label className="text-sm text-slate-600 mb-1 font-medium">上緯新材股價 (人民幣)</label>
                            <div className="relative">
                            <input
                                type="number"
                                name="smPrice"
                                value={marketData.smPrice}
                                onChange={handleMarketChange}
                                step="0.01"
                                className="w-full p-3 pl-8 bg-white border-2 border-orange-200 rounded-lg focus:border-orange-500 focus:outline-none text-xl font-bold text-slate-800 shadow-sm transition-colors"
                            />
                            <span className="absolute left-3 top-3.5 text-slate-400">¥</span>
                            </div>
                        </div>

                        {/* 輸入: 匯率 */}
                        <div className="flex flex-col">
                            <label className="text-sm text-slate-600 mb-1 font-medium">匯率 (人民幣 換 台幣)</label>
                            <div className="relative">
                            <input
                                type="number"
                                name="exchangeRate"
                                value={marketData.exchangeRate}
                                onChange={handleMarketChange}
                                step="0.01"
                                className="w-full p-3 pl-8 bg-white border-2 border-orange-200 rounded-lg focus:border-orange-500 focus:outline-none text-xl font-bold text-slate-800 shadow-sm transition-colors"
                            />
                            <span className="absolute left-3 top-3.5 text-slate-400">x</span>
                            </div>
                        </div>

                        {/* 輸入: 投控股價 */}
                        <div className="flex flex-col">
                            <label className="text-sm text-slate-600 mb-1 font-medium">上緯投控股價 (台幣)</label>
                            <div className="relative">
                            <input
                                type="number"
                                name="shPrice"
                                value={marketData.shPrice}
                                onChange={handleMarketChange}
                                step="0.1"
                                className="w-full p-3 pl-8 bg-white border-2 border-orange-200 rounded-lg focus:border-orange-500 focus:outline-none text-xl font-bold text-slate-800 shadow-sm transition-colors"
                            />
                            <span className="absolute left-3 top-3.5 text-slate-400">$</span>
                            </div>
                        </div>

                        </div>
                    </div>

                    {/* 區塊 2: 計算結果核心 */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        
                        {/* 左側：淨值貢獻分析 */}
                        <div className="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                        <h3 className="text-slate-500 font-medium text-sm mb-4 uppercase tracking-wider">資產價值解析 (每股)</h3>
                        
                        <div className="space-y-3">
                            {/* 步驟 1: 總市值 */}
                            <div className="flex justify-between items-end border-b border-slate-100 pb-2">
                            <span className="text-slate-600 text-sm">上緯新材總市值 (台幣)</span>
                            <span className="font-semibold text-lg">
                                ${formatNumber(results.totalValueTwd)}
                            </span>
                            </div>
                            
                            {/* 步驟 2: 扣除項 (紅字顯示) */}
                            <div className="flex justify-between items-end border-b border-slate-100 pb-2 text-rose-600 bg-rose-50 px-2 -mx-2 rounded">
                            <span className="text-sm font-medium">減：已認列重估利益</span>
                            <span className="font-medium text-sm">
                                - ${formatNumber(REVALUATION_GAIN)}
                            </span>
                            </div>

                            {/* 步驟 3: 剩餘價值 */}
                            <div className="flex justify-between items-end border-b border-slate-100 pb-2">
                            <span className="text-slate-800 text-sm font-bold">剩餘可貢獻權益</span>
                            <span className={`font-bold text-lg ${results.netValueTwd >= 0 ? 'text-slate-800' : 'text-rose-600'}`}>
                                ${formatNumber(results.netValueTwd)}
                            </span>
                            </div>
                            
                            {/* 步驟 4: 除以股數 */}
                            <div className="flex justify-between items-end border-b border-slate-100 pb-2">
                            <span className="text-slate-400 text-xs">÷ 投控流通股數</span>
                            <span className="text-slate-400 text-xs">
                                {formatNumber(constants.shOutstanding)} 股
                            </span>
                            </div>

                            {/* 結果 1: 貢獻值 */}
                            <div className="flex justify-between items-center bg-teal-50 p-3 rounded-lg mt-2">
                            <span className="text-teal-800 font-bold text-sm">① 修正後每股貢獻</span>
                            <span className={`text-2xl font-bold ${results.navContribution >= 0 ? 'text-teal-600' : 'text-rose-600'}`}>
                                ${results.navContribution.toFixed(2)}
                            </span>
                            </div>
                            
                            {/* 結果 2: 基礎淨值輸入 */}
                            <div className="flex justify-between items-center p-2">
                            <span className="text-slate-500 text-sm">② 預測 Q4 基礎淨值</span>
                            <input 
                                type="number"
                                name="baseNav"
                                value={constants.baseNav}
                                onChange={handleConstantChange}
                                className="w-24 text-right border-b border-slate-300 focus:border-teal-500 outline-none font-semibold text-slate-700 bg-transparent"
                            />
                            </div>
                        </div>
                        </div>

                        {/* 右側：最終結果 (P/B) */}
                        <div className="flex flex-col gap-4">
                        
                        {/* 總淨值卡片 */}
                        <div className="bg-gradient-to-r from-slate-800 to-slate-700 text-white p-5 rounded-xl shadow-md flex-1 flex flex-col justify-center relative overflow-hidden">
                            <DollarSign className="absolute -right-4 -bottom-4 w-24 h-24 text-slate-600 opacity-20" />
                            <span className="text-slate-300 text-sm font-medium mb-1">修正後 預估總每股淨值</span>
                            <div className="flex items-baseline gap-2">
                            <span className="text-4xl font-bold tracking-tight">
                                ${results.totalEstimatedNav.toFixed(2)}
                            </span>
                            <span className="text-slate-400 text-sm">(① + ②)</span>
                            </div>
                            <p className="text-slate-400 text-xs mt-2">
                            已扣除 37.52 億原認列利益
                            </p>
                        </div>

                        {/* P/B Ratio 卡片 */}
                        <div className={`p-5 rounded-xl shadow-md flex-1 flex flex-col justify-center relative overflow-hidden transition-colors ${results.pbRatio < 1 ? 'bg-green-600 text-white' : results.pbRatio < 1.5 ? 'bg-blue-600 text-white' : 'bg-amber-500 text-white'}`}>
                            <TrendingUp className="absolute -right-4 -bottom-4 w-24 h-24 text-white opacity-20" />
                            <span className="text-white/90 text-sm font-medium mb-1">即時股價淨值比 (P/B Ratio)</span>
                            <div className="flex items-baseline gap-2">
                            <span className="text-5xl font-bold tracking-tight">
                                {results.pbRatio.toFixed(2)}
                            </span>
                            <span className="text-white/80 text-sm font-medium">倍</span>
                            </div>
                            <p className="text-white/70 text-xs mt-2">
                            股價 ${marketData.shPrice} ÷ 淨值 ${results.totalEstimatedNav.toFixed(2)}
                            </p>
                        </div>

                        </div>
                    </div>

                    {/* 區塊 3: 進階設定 (摺疊收納) */}
                    <details className="group bg-slate-50 border border-slate-200 rounded-lg">
                        <summary className="p-4 cursor-pointer font-medium text-slate-600 hover:text-slate-900 flex items-center justify-between select-none">
                        <span className="flex items-center gap-2"><Info className="w-4 h-4"/> 進階參數設定</span>
                        <span className="text-xs text-slate-400 group-open:rotate-180 transition-transform">▼</span>
                        </summary>
                        <div className="p-4 pt-0 grid grid-cols-1 md:grid-cols-2 gap-4 border-t border-slate-200 mt-2">
                        <div className="flex flex-col mt-4">
                            <label className="text-xs text-slate-500 mb-1">上緯新材持有股數 (股)</label>
                            <input
                            type="number"
                            name="smShares"
                            value={constants.smShares}
                            onChange={handleConstantChange}
                            className="p-2 bg-white border border-slate-300 rounded text-sm"
                            />
                        </div>
                        <div className="flex flex-col mt-4">
                            <label className="text-xs text-slate-500 mb-1">上緯投控流通股數 (股)</label>
                            <input
                            type="number"
                            name="shOutstanding"
                            value={constants.shOutstanding}
                            onChange={handleConstantChange}
                            className="p-2 bg-white border border-slate-300 rounded text-sm"
                            />
                        </div>
                        </div>
                    </details>

                    </div>
                </div>
                <div className="text-center text-slate-400 text-xs mt-8">
                    此計算機僅供參考。淨值計算已包含扣除 37.52 億元之邏輯修正。
                </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
