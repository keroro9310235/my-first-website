<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飆股型態分析師 (v5.0 買點偵測版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 自訂樣式 */
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #111827; /* Dark gray background */
        }
        .glass-card {
            background: rgba(31, 41, 55, 0.6); /* Semi-transparent dark background */
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem; /* More rounded corners */
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .progress-ring__circle {
            transition: stroke-dashoffset 0.5s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        .upload-box:hover {
            border-color: #3b82f6; /* Blue border on hover */
        }
        .btn-primary {
            background-color: #3b82f6;
            transition: background-color 0.3s;
        }
        .btn-primary:hover {
            background-color: #2563eb;
        }
        .btn-primary:disabled {
            background-color: #4b5563;
            cursor: not-allowed;
        }
        /* 讓 input[type=file] 隱藏 */
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body class="text-gray-200">
    <div class="container mx-auto p-4 sm:p-6 md:p-8 max-w-4xl">
        
        <header class="text-center mb-8">
            <h1 class="text-4xl sm:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-teal-300">
                飆股型態分析師
            </h1>
            <p class="text-gray-400 mt-2 text-lg">【v5.0 買點偵測版】分析型態，更鎖定最佳買點</p>
        </header>

        <main class="space-y-8">
            <!-- API Key Section -->
            <section id="apiKeySection" class="glass-card p-6 sm:p-8">
                <h2 class="text-2xl font-semibold mb-4 border-b border-gray-600 pb-2">步驟一：設定 API 金鑰</h2>
                <label for="apiKeyInput" class="block mb-2 text-sm font-medium text-gray-300">您的 Google AI API 金鑰</label>
                <input type="password" id="apiKeyInput" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="請在此貼上您的 API 金鑰">
                <p class="mt-2 text-xs text-gray-500">
                    本網站需要您的 Google AI API 金鑰才能運作。
                    <a href="https://aistudio.google.com/app/apikey" target="_blank" class="font-medium text-blue-400 hover:underline">點此前往 Google AI Studio 取得免費金鑰</a>。
                </p>
            </section>

            <!-- Upload Section -->
            <section id="uploadSection" class="glass-card p-6 sm:p-8">
                <h2 class="text-2xl font-semibold mb-4 border-b border-gray-600 pb-2">步驟二：上傳K線圖</h2>
                <label for="fileUpload" class="upload-box w-full p-10 border-2 border-dashed border-gray-600 rounded-xl flex flex-col items-center justify-center cursor-pointer transition-all duration-300">
                    <svg class="w-16 h-16 text-gray-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-4-4V6a4 4 0 014-4h10a4 4 0 014 4v6a4 4 0 01-4 4H7z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 16v1a2 2 0 01-2 2H3c-1.1 0-2-.9-2-2V7c0-1.1.9-2 2-2h2m12 14v-2a2 2 0 00-2-2h-2m-4-4h.01"></path></svg>
                    <p id="uploadText" class="text-gray-400 text-center">點擊此處選擇圖檔，或將圖檔拖曳至此</p>
                    <p class="text-xs text-gray-500 mt-2">（支援 PNG, JPG, GIF 等格式）</p>
                </label>
                <input type="file" id="fileUpload" accept="image/*">
            </section>

            <!-- Preview and Analyze Section -->
            <section id="previewSection" class="glass-card p-6 sm:p-8 hidden">
                <h2 class="text-2xl font-semibold mb-4 border-b border-gray-600 pb-2">步驟三：確認圖片並開始分析</h2>
                <div class="mt-4 flex flex-col items-center">
                    <img id="imagePreview" src="" alt="圖片預覽" class="max-w-full h-auto max-h-96 rounded-lg shadow-lg border-2 border-gray-600">
                    <button id="analyzeBtn" class="btn-primary w-full sm:w-1/2 mt-6 py-3 text-lg font-bold text-white rounded-lg shadow-md" disabled>
                        開始分析
                    </button>
                </div>
            </section>

            <!-- Result Section -->
            <section id="resultSection" class="glass-card p-6 sm:p-8 hidden">
                 <h2 class="text-2xl font-semibold mb-6 border-b border-gray-600 pb-2">分析結果</h2>
                
                <!-- Loading Spinner -->
                <div id="loadingSpinner" class="text-center py-10 hidden">
                    <svg class="animate-spin h-12 w-12 text-blue-400 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <p class="mt-4 text-lg text-gray-400">正在用您的專家心法進行深度分析...</p>
                </div>

                <!-- Error Message -->
                <div id="errorMessage" class="hidden bg-red-900 border border-red-600 text-red-200 px-4 py-3 rounded-lg" role="alert">
                    <strong class="font-bold">分析失敗！</strong>
                    <span id="errorText" class="block sm:inline"></span>
                </div>

                <!-- Result Content -->
                <div id="resultContent" class="hidden">
                    <div class="flex flex-col md:flex-row items-center gap-8">
                        <!-- Percentage Circle -->
                        <div class="relative w-48 h-48 sm:w-56 sm:h-56">
                            <svg class="w-full h-full" viewBox="0 0 120 120">
                                <circle class="text-gray-700" stroke-width="10" stroke="currentColor" fill="transparent" r="50" cx="60" cy="60" />
                                <circle id="progressCircle" class="progress-ring__circle text-blue-400" stroke-width="10" stroke-linecap="round" stroke="currentColor" fill="transparent" r="50" cx="60" cy="60" />
                            </svg>
                            <div class="absolute inset-0 flex flex-col items-center justify-center">
                                <span id="percentageText" class="text-4xl sm:text-5xl font-bold text-white">0%</span>
                                <span class="text-sm text-gray-400">飆股 DNA 符合度</span>
                            </div>
                        </div>
                        <!-- Summary -->
                        <div class="flex-1 text-center md:text-left">
                            <p class="text-lg text-gray-400">主要型態：<span id="analysisModel" class="font-semibold text-teal-300"></span></p>
                            <p id="summaryText" class="text-2xl sm:text-3xl font-semibold mt-2"></p>
                        </div>
                    </div>

                    <!-- Optimal Buy Point Analysis Section -->
                    <div id="buyPointSection" class="mt-10 p-5 rounded-xl border">
                        <h3 class="text-xl font-semibold flex items-center mb-3">
                            <svg id="buyPointIcon" class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            最佳買點分析
                        </h3>
                        <p id="buyPointResult" class="text-lg"></p>
                        <ul id="buyPointReasoning" class="mt-2 list-disc list-inside space-y-1 text-gray-400 text-sm">
                            <!-- Reasoning points will be inserted here -->
                        </ul>
                    </div>
                    
                    <div class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Positive Points -->
                        <div>
                            <h3 class="text-xl font-semibold flex items-center text-green-400">
                                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                主要得分項 (符合飆股 DNA)
                            </h3>
                            <ul id="positivePoints" class="mt-3 list-disc list-inside space-y-2 text-gray-300">
                                <!-- Points will be inserted here -->
                            </ul>
                        </div>
                        <!-- Negative Points -->
                        <div>
                            <h3 class="text-xl font-semibold flex items-center text-red-400">
                                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                主要失分項 (違背飆股 DNA)
                            </h3>
                            <ul id="negativePoints" class="mt-3 list-disc list-inside space-y-2 text-gray-300">
                                <!-- Points will be inserted here -->
                            </ul>
                        </div>
                    </div>
                </div>
            </section>

        </main>
        
        <footer class="text-center text-gray-600 mt-12 text-sm">
            <p>&copy; 2025 飆股型態分析師. All rights reserved.</p>
            <p class="mt-1">本分析僅供技術交流，不構成任何投資建議。</p>
        </footer>

    </div>

    <script>
        const fileUpload = document.getElementById('fileUpload');
        const uploadBox = document.querySelector('.upload-box');
        const uploadText = document.getElementById('uploadText');
        const previewSection = document.getElementById('previewSection');
        const imagePreview = document.getElementById('imagePreview');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const resultSection = document.getElementById('resultSection');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const resultContent = document.getElementById('resultContent');
        const progressCircle = document.getElementById('progressCircle');
        const percentageText = document.getElementById('percentageText');
        const summaryText = document.getElementById('summaryText');
        const analysisModel = document.getElementById('analysisModel');
        const positivePoints = document.getElementById('positivePoints');
        const negativePoints = document.getElementById('negativePoints');
        const apiKeyInput = document.getElementById('apiKeyInput');
        // New UI elements for buy point analysis
        const buyPointSection = document.getElementById('buyPointSection');
        const buyPointIcon = document.getElementById('buyPointIcon');
        const buyPointResult = document.getElementById('buyPointResult');
        const buyPointReasoning = document.getElementById('buyPointReasoning');

        let base64ImageData = "";

        // Setup progress circle
        const radius = progressCircle.r.baseVal.value;
        const circumference = 2 * Math.PI * radius;
        progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
        progressCircle.style.strokeDashoffset = circumference;

        function setProgress(percent) {
            const offset = circumference - (percent / 100) * circumference;
            progressCircle.style.strokeDashoffset = offset;
            percentageText.textContent = `${Math.round(percent)}%`;
        }

        function checkCanAnalyze() {
            analyzeBtn.disabled = !(base64ImageData && apiKeyInput.value.trim() !== '');
        }
        
        // --- Event listeners setup ---
        uploadBox.addEventListener('click', () => fileUpload.click());
        apiKeyInput.addEventListener('input', checkCanAnalyze);

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadBox.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }
        
        uploadBox.addEventListener('dragover', () => uploadBox.classList.add('border-blue-500', 'bg-gray-800'));
        uploadBox.addEventListener('dragleave', () => uploadBox.classList.remove('border-blue-500', 'bg-gray-800'));

        uploadBox.addEventListener('drop', (e) => {
            uploadBox.classList.remove('border-blue-500', 'bg-gray-800');
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) handleFile(files[0]);
        });

        fileUpload.addEventListener('change', (event) => {
            if (event.target.files.length > 0) handleFile(event.target.files[0]);
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('請上傳圖片格式的檔案！');
                return;
            }
            const reader = new FileReader();
            reader.onloadend = () => {
                imagePreview.src = reader.result;
                base64ImageData = reader.result.split(',')[1];
                uploadText.textContent = `已選擇檔案: ${file.name}`;
                previewSection.classList.remove('hidden');
                resultSection.classList.add('hidden');
                checkCanAnalyze();
            };
            reader.readAsDataURL(file);
        }

        analyzeBtn.addEventListener('click', () => {
            if (!base64ImageData || !apiKeyInput.value) return;
            analyzeImage();
        });

        async function analyzeImage() {
            resultSection.classList.remove('hidden');
            loadingSpinner.classList.remove('hidden');
            resultContent.classList.add('hidden');
            errorMessage.classList.add('hidden');

            const userApiKey = apiKeyInput.value.trim();
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${userApiKey}`;

            const systemPrompt = `你是一位頂尖的股票技術分析專家，由一位資深投資人(我)透過20個經典成功案例訓練而成。你的任務是：1. 辨識飆股型態。 2. 鎖定最佳買點。

            **第一部分：飆股DNA篩選原則 (嚴格執行！)**
            1.  **天空原則 (無壓力)**：優先尋找突破點創下至少52週新高，甚至是歷史新高的圖形。突破點的左方必須視野開闊，沒有明顯的頭部或密集成交區形成的套牢壓力。
            2.  **趨勢原則 (非死貓跳)**：目標股票必須處於長期多頭或至少是長期盤整的趨勢中。透過視覺判斷長天期均線（如年線/240MA）的斜率，必須是走平或穩定上揚。絕不接受年線下彎的空頭反彈型態。
            3.  **量能原則 (燃料充足)**：整理期間必須呈現健康的「量縮」，成交量柱狀圖應遠低於近期高點。突破當天或近期，必須出現明顯的「攻擊量」，成交量應是整理期間平均量的2倍以上。
            4.  **均線原則 (萬箭齊發)**：在突破發動點附近，短期均線(5MA, 10MA)與中期均線(20MA, 60MA)必須呈現糾結後向上發散的「黃金交叉」或「多頭排列」狀態。

            **第二部分：最佳買點偵測心法 (精準鎖定)**
            在確認圖表符合飆股DNA後，你的下一個任務是判斷圖中最右側的K棒是否為「最佳買點」。最佳買點具備以下視覺特徵：
            * **K棒特徵**: 必須是一根強勢的陽線 (長紅K)，收盤價接近當日最高價。實體長度應明顯大於近期K棒。
            * **位置特徵**: 這根K棒的收盤價必須決定性地突破整理區的頸線或壓力線。不能是試探性的觸碰。
            * **量能特徵**: 這根K棒下方的成交量，必須是明確的「攻擊量」(符合量能原則)，是近期量縮整理時的數倍。
            * **時機特徵**: 這是整理結束、趨勢發動的第一根信號K棒。如果股價已經連續大漲多日，則已錯過「最佳」買點。

            你的任務是，先根據「飆股DNA原則」審查使用者上傳的K線圖，再用「最佳買點偵測心法」判斷目前是否處於進場點，並以JSON格式回傳一份包含這兩部分分析的完整報告。`;

            const schema = {
                type: "OBJECT",
                properties: {
                    patternAnalysis: {
                        type: "OBJECT",
                        description: "關於整體型態的分析",
                        properties: {
                            matchPercentage: { type: "NUMBER", description: "與「飆股DNA」的總體符合度百分比 (0-100)。任何一項原則有重大違背，分數就不應高於40分。" },
                            summary: { type: "STRING", description: "一句話總結型態分析，例如：『此型態為標準的「底部/VCP突破型」，完全符合飆股DNA原則。』" },
                            analysisModel: { type: "STRING", description: "判斷最主要符合的型態分類 ('A. 底部/VCP突破型', 'B. 碗型底突破型', 'C. 中繼平台整理型', 'D. 高位旗形整理型', 'E. 其他混合型', 或 '不符合飆股DNA')" },
                            positivePoints: { type: "ARRAY", items: { "type": "STRING" }, description: "條列說明圖中完全符合四大DNA原則的優點" },
                            negativePoints: { type: "ARRAY", items: { "type": "STRING" }, description: "條列說明圖中違背四大DNA原則的缺點或疑慮" }
                        }
                    },
                    buyPointAnalysis: {
                        type: "OBJECT",
                        description: "關於最佳買點的分析",
                        properties: {
                            isOptimalBuyPoint: { type: "BOOLEAN", description: "目前的K線圖最右側是否處於最佳買點" },
                            confidence: { type: "NUMBER", description: "對於是否為最佳買點的信心度 (0-100)" },
                            reasoning: { type: "ARRAY", items: { "type": "STRING" }, description: "條列說明判斷最佳買點的理由，例如：『決定性的突破K棒已出現』、『攻擊量能已確認』或『目前處於整理階段，尚未出現買點信號』" }
                        }
                    }
                },
                required: ["patternAnalysis", "buyPointAnalysis"]
            };

            const payload = {
                systemInstruction: { parts: [{ text: systemPrompt }] },
                contents: [{
                    parts: [
                        { text: "請嚴格根據你在系統指令中學到的「飆股DNA原則」與「最佳買點偵測心法」，詳細分析底下這張使用者上傳的新K線圖，並以JSON格式回傳你的分析結果：" },
                        { inlineData: { mimeType: fileUpload.files[0]?.type || "image/png", data: base64ImageData } }
                    ]
                }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: schema
                }
            };
            
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`API 請求失敗: ${errorData.error?.message || response.statusText}`);
                }

                const result = await response.json();
                
                const candidate = result.candidates?.[0];
                if (!candidate || !candidate.content?.parts?.[0]?.text) {
                     throw new Error('從 API 回應中無法解析出有效的分析結果。');
                }

                const analysisData = JSON.parse(candidate.content.parts[0].text);
                displayResults(analysisData);

            } catch (error) {
                console.error('分析過程中發生錯誤:', error);
                displayError(`分析時發生錯誤: ${error.message}`);
            } finally {
                loadingSpinner.classList.add('hidden');
            }
        }

        function displayResults(data) {
            // --- Pattern Analysis ---
            const pa = data.patternAnalysis;
            if (pa) {
                setProgress(0); // Reset before animation
                setTimeout(() => setProgress(pa.matchPercentage || 0), 100);

                summaryText.textContent = pa.summary || '無法提供型態總結。';
                analysisModel.textContent = pa.analysisModel || '未知';

                positivePoints.innerHTML = (pa.positivePoints || []).map(point => `<li>${point}</li>`).join('') || '<li>無明顯得分項。</li>';
                negativePoints.innerHTML = (pa.negativePoints || []).map(point => `<li>${point}</li>`).join('') || '<li>無明顯失分項。</li>';
            }

            // --- Buy Point Analysis ---
            const bpa = data.buyPointAnalysis;
            if (bpa) {
                buyPointSection.classList.remove('border-green-500', 'border-red-500', 'border-yellow-500', 'bg-green-900/20', 'bg-red-900/20', 'bg-yellow-900/20');
                buyPointIcon.classList.remove('text-green-400', 'text-red-400', 'text-yellow-400');
                
                if (bpa.isOptimalBuyPoint) {
                    buyPointSection.classList.add('border-green-500', 'bg-green-900/20');
                    buyPointIcon.classList.add('text-green-400');
                    buyPointResult.textContent = `是！目前處於最佳買點 (信心度: ${bpa.confidence}%)`;
                } else {
                     buyPointSection.classList.add('border-red-500', 'bg-red-900/20');
                    buyPointIcon.classList.add('text-red-400');
                    buyPointResult.textContent = `否。尚未出現或已錯過最佳買點 (信心度: ${bpa.confidence}%)`;
                }
                buyPointReasoning.innerHTML = (bpa.reasoning || []).map(point => `<li>${point}</li>`).join('') || '<li>無法提供判斷理由。</li>';
            }

            resultContent.classList.remove('hidden');
        }

        function displayError(message) {
            errorText.textContent = message;
            errorMessage.classList.remove('hidden');
        }

    </script>
</body>
</html>
